<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>健康チェック</title>
<meta name="apple-mobile-web-app-title" content="健康チェック">
<meta name="application-name" content="健康チェック">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#f5f5f2;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<!-- 製造部 健康チェック：アプリ本体（Google Apps Script）をこのページに埋め込んで表示します -->
<iframe id="app" title="健康チェック" allow="clipboard-write"></iframe>
<script>
var GAS = 'https://script.google.com/macros/s/AKfycbzokPys8QUrJEOuASxbWY1JI6exVly22NUCggVi_ZqnWc4AsXDl3szLhzpW-5nlPP9RLw/exec';
var KEY = 'kenko_name_v1';
function getName(){ try{ return localStorage.getItem(KEY) || ''; }catch(e){ return ''; } }
function setName(v){ try{ localStorage.setItem(KEY, v); }catch(e){} }

// 名前：①このページのURL（?n=名前） ②このスマホに保存した名前
var q = new URLSearchParams(location.search);
var n = q.get('n') || getName();
if (q.get('n')) setName(q.get('n'));
document.getElementById('app').src = GAS + '?embed=1' + (n ? '&n=' + encodeURIComponent(n) : '');

// アプリで名前を選んだら、このページにも覚えさせる（ホーム画面に追加したときにも残るようURLにも付ける）
window.addEventListener('message', function(ev){
  var host = '';
  try{ host = new URL(ev.origin).hostname; }catch(e){ return; }
  if (!/(\.googleusercontent\.com|\.google\.com)$/.test(host)) return;
  var d = ev.data;
  if (d && d.type === 'kenko-name' && typeof d.n === 'string' && d.n){
    setName(d.n);
    try{ history.replaceState(null, '', '?n=' + encodeURIComponent(d.n)); }catch(e){}
  }
});
</script>
</body>
</html>
